spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/warehouse_project_server}
spring.data.mongodb.auto-index-creation=true

jwt.token.secret=${JWT_SECRET:mySuperSecretKeyForJWTAtLeast32CharsLong}
jwt.token.expired=3600000

server.port=${PORT:8080}
server.servlet.context-path=/api

# UTF-8 для всех HTTP-ответов (фикс для кириллицы)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Даты как ISO-строки, а не как массивы чисел [2026,5,25,10,30,0]
spring.jackson.serialization.write-dates-as-timestamps=false

logging.level.com.nester=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS — через запятую, без пробелов: http://localhost:3000,https://your-app.vercel.app
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}